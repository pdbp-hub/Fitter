<title>Fitter Entwurf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app. Scrolling screen + fixed bottom nav with octagon in the centre; workout runs in a sheet that minimises to a floating bar. */
:root {
  --bg: #0b0b0a; --fg: #f3f3ef; --surface: #161615; --line: #2a2a27; --muted: #8d8d86; --dim: #55554f;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --oct: polygon(29.29% 0, 70.71% 0, 100% 29.29%, 100% 70.71%, 70.71% 100%, 29.29% 100%, 0 70.71%, 0 29.29%);
  --kb: 0px;
  color-scheme: dark;
}
.inverted { --bg: #f3f3ef; --fg: #0b0b0a; --surface: #e7e7e1; --line: #d3d3cc; --muted: #6c6c66; --dim: #a9a9a2; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: #0b0b0a; color: #f3f3ef; font-family: var(--body); overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
input::placeholder { color: var(--dim); }

.app { position: fixed; inset: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
.screen { flex: 1; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(18px + env(safe-area-inset-top, 0px)) 170px; }
.inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-stretch: 112%; font-weight: 900; font-size: 34px; line-height: .95; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.45; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font-size: 20px; flex: none; }
.iconbtn.solid { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.iconbtn svg { width: 20px; height: 20px; }
.textbtn { font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); padding: 6px 0; }

/* Start */
.points small { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); display: block; margin-bottom: 6px; text-transform: uppercase; }
.points b { font-family: var(--display); font-stretch: 62%; font-weight: 900; font-size: 60px; line-height: .8; }
.points .delta { font-family: var(--mono); font-size: 12px; margin-top: 8px; }
.hero { display: grid; place-items: center; padding-block: 6px; }
.octa { width: min(80vw, 330px); max-width: 100%; aspect-ratio: 1; background: var(--fg); color: var(--bg); clip-path: var(--oct); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 15%; animation: pulse 2.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
.octa:active { animation: none; transform: scale(.96); }
.octa .greet { font-weight: 500; font-size: 14px; line-height: 1.3; max-width: 22ch; }
.octa .cta { font-family: var(--display); font-weight: 900; font-stretch: 125%; font-size: clamp(30px, 9.5vw, 42px); line-height: .9; text-transform: uppercase; }
.octa .tap { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }
.weekstats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.weekstats div { padding: 14px 4px; display: flex; flex-direction: column; gap: 4px; }
.weekstats div + div { border-left: 1px solid var(--line); padding-left: 12px; }
.weekstats b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 26px; }
.weekstats span { font-size: 11px; color: var(--muted); }

/* Workout list */
.witem { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.witem:first-child { border-top: 1px solid var(--line); }
.wname { font-family: var(--display); font-stretch: 110%; font-weight: 900; font-size: 24px; text-transform: uppercase; }
.wex { grid-column: 1; font-size: 13px; color: var(--muted); line-height: 1.4; }
.wlast { grid-column: 1; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.go { grid-row: 1 / span 3; grid-column: 2; align-self: center; width: 58px; height: 58px; background: var(--fg); color: var(--bg); clip-path: var(--oct); display: grid; place-items: center; font-family: var(--display); font-stretch: 125%; font-weight: 900; font-size: 17px; }
.witem:active .go { transform: scale(.92); }

/* Progress */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1px solid var(--line); padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.day small { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
.day b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 18px; }
.day i { font-style: normal; font-family: var(--mono); font-size: 10px; font-weight: 700; height: 14px; }
.day.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.day.on small { color: var(--bg); opacity: .7; }
.day.today { border-color: var(--fg); }
.day.sel { outline: 2px solid var(--fg); outline-offset: 2px; }
.cal { display: flex; flex-direction: column; gap: 10px; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calgrid .wd { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; padding-bottom: 4px; }
.calgrid button { aspect-ratio: 1; border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; min-width: 0; }
.calgrid button i { font-style: normal; font-family: var(--mono); font-size: 9px; font-weight: 700; }
.calgrid button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.calgrid button.out { visibility: hidden; }
.calgrid button.today { border-color: var(--fg); }
.calgrid button.sel { outline: 2px solid var(--fg); outline-offset: 2px; }
.daydetail { font-size: 13px; border-left: 2px solid var(--fg); padding: 4px 0 4px 10px; min-height: 20px; }
.lastrow { display: flex; flex-wrap: wrap; gap: 8px; }
.lastrow span { border: 1px solid var(--line); padding: 7px 10px; font-size: 12px; }
.lastrow b { font-weight: 700; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.statgrid div { background: var(--bg); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.statgrid b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 28px; }
.statgrid span { font-size: 12px; color: var(--muted); }
.exsel { display: flex; align-items: center; gap: 10px; text-align: left; font-family: var(--display); font-stretch: 105%; font-weight: 900; font-size: 26px; text-transform: uppercase; line-height: 1; }
.exsel span { font-size: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); padding: 8px 12px; font-size: 13px; border-radius: 999px; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); font-family: var(--mono); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 22px; border-top: 2px solid var(--fg); vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.empty { border: 1px dashed var(--line); padding: 24px 16px; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
.pb { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.pb:first-child { border-top: 1px solid var(--line); }
.pb b { font-weight: 700; font-size: 15px; }
.pb .pw { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 22px; text-align: right; }
.pb small { color: var(--muted); font-size: 12px; }
.pb small:last-child { text-align: right; }

/* Settings */
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.setrow:first-child { border-top: 1px solid var(--line); }
.setrow p { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.setrow > div:first-child { min-width: 0; }
.seg { display: flex; border: 1px solid var(--fg); flex: none; }
.seg button { padding: 8px 14px; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.seg button.on { background: var(--fg); color: var(--bg); }
.toggle { width: 52px; height: 30px; border: 1px solid var(--fg); position: relative; border-radius: 999px; flex: none; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: left .2s; }
.toggle[aria-checked="true"] { background: var(--fg); }
.toggle[aria-checked="true"] i { left: 25px; background: var(--bg); }
.toggle:disabled { opacity: .3; }
.info { width: 22px; height: 22px; border: 1px solid var(--muted); border-radius: 50%; font-family: var(--mono); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; margin-left: 6px; vertical-align: middle; color: var(--muted); }
.infobox { font-size: 13px; line-height: 1.5; background: var(--surface); padding: 12px 14px; margin-top: -8px; border-bottom: 1px solid var(--line); }
.kgin { display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid var(--fg); flex: none; }
.kgin input { width: 64px; background: none; border: 0; text-align: right; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 24px; padding: 2px 0; }
.anims { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.animopt { border: 1px solid var(--line); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.animopt svg { width: 56px; height: 56px; }
.animopt.on { border-color: var(--fg); outline: 1px solid var(--fg); }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-top: 8px; }
.nav .navrow { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }
.navbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
.navbtn.on { color: var(--fg); }
.navbtn svg { width: 24px; height: 24px; }
.navoct { width: 78px; height: 78px; margin-top: -30px; background: var(--fg); color: var(--bg); clip-path: var(--oct); display: grid; place-items: center; font-family: var(--display); font-stretch: 125%; font-weight: 900; font-size: 15px; }
.navoct.off { opacity: .55; }

/* Mini player */
.mini { position: fixed; z-index: 19; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin: 0 auto; background: var(--fg); color: var(--bg); display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 16px; text-align: left; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
.mini > div { min-width: 0; }
.mini .mphase { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.mini .mname { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .mtime { margin-left: auto; font-family: var(--display); font-stretch: 70%; font-weight: 800; font-size: 30px; }

/* Sheets */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.sheet.down { transform: translateY(105%); pointer-events: none; }
.sheet .handle { padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 6px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .handle i { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.sheet .screen { padding-top: 8px; padding-bottom: 150px; }
#osheet { z-index: 32; }
#osheet .screen { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.bar { position: absolute; left: 0; right: 0; bottom: var(--kb); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 28px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
.bar > div { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.mainbtn { width: 100%; padding: 18px; background: var(--fg); color: var(--bg); font-family: var(--display); font-stretch: 120%; font-weight: 900; font-size: 18px; text-transform: uppercase; }
.mainbtn:active { transform: scale(.98); }
.ghostbtn { width: 100%; padding: 14px; border: 1px solid var(--line); font-weight: 600; font-size: 14px; }

.whead { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; text-align: center; }
.whead .overall { font-family: var(--mono); font-size: 14px; font-weight: 700; }
.phase { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pill { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--fg); padding: 4px 10px; }
.pill.solid { background: var(--fg); color: var(--bg); }
.bigtime { font-family: var(--display); font-stretch: 62%; font-weight: 900; font-size: clamp(88px, 30vw, 140px); line-height: .9; }

.readyex { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.idx { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.mv { display: flex; gap: 4px; }
.mv button { width: 34px; height: 34px; border: 1px solid var(--line); font-size: 14px; }
.mv button:disabled { opacity: .25; }
.exname { font-weight: 700; font-size: 15px; min-width: 0; }
.exname small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }

.block { border-top: 1px solid var(--line); }
.block:last-of-type { border-bottom: 1px solid var(--line); }
.bhead { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 14px 0; width: 100%; text-align: left; }
.bhead .stat { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.block.cur { border: 1px solid var(--fg); padding: 0 14px 14px; margin-block: 6px; }
.block.cur + .block { border-top: 0; }
.block.cur .exname { font-family: var(--display); font-stretch: 110%; font-weight: 900; font-size: 22px; text-transform: uppercase; }
.block.done .exname { color: var(--muted); }
.setlist { display: flex; flex-direction: column; gap: 6px; padding-bottom: 6px; }
.setrow2 { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); text-align: left; width: 100%; }
.setrow2 .sv { font-family: var(--display); font-stretch: 85%; font-weight: 800; font-size: 19px; }
.setrow2.planned { color: var(--dim); border-style: dashed; }
.setrow2.active { border-color: var(--fg); display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.setrow2 .ck { font-family: var(--mono); font-size: 12px; }
.running { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; background: var(--fg); color: var(--bg); padding: 2px 6px; }
.steppers { display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px; }
.stepper { display: flex; flex-direction: column; gap: 4px; }
.stepper label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.ctl { display: flex; align-items: center; gap: 4px; }
.ctl button { width: 34px; height: 40px; border: 1px solid var(--line); font-size: 18px; flex: none; color: var(--muted); }
.ctl input { width: 100%; min-width: 0; background: var(--surface); border: 0; border-bottom: 2px solid var(--fg); text-align: center; font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 26px; padding: 4px 0; }
.bwnote { font-size: 11px; color: var(--muted); }
.addset { align-self: flex-start; font-size: 13px; font-weight: 700; padding: 8px 0; }
.switch { font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 6px 0; align-self: flex-start; }

.animwrap { display: grid; place-items: center; padding-block: 8px; }
.animwrap svg { width: min(62vw, 250px); height: auto; max-width: 100%; }

.rv-hero { display: grid; place-items: center; }
.rv-oct { width: min(66vw, 260px); aspect-ratio: 1; max-width: 100%; background: var(--fg); color: var(--bg); clip-path: var(--oct); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; }
.rv-oct b { font-family: var(--display); font-stretch: 62%; font-weight: 900; font-size: 70px; line-height: .9; }
.rv-oct span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.hl div { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); }
.hl b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 24px; min-width: 84px; }
.hl span { font-size: 14px; line-height: 1.4; }

/* Create / picker */
.field { width: 100%; background: none; border: 0; border-bottom: 2px solid var(--fg); padding: 10px 0; font-family: var(--display); font-stretch: 110%; font-weight: 900; font-size: 26px; text-transform: uppercase; }
.searchrow { display: flex; gap: 8px; }
.search { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; font-size: 15px; }
.filterbtn { width: 48px; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.filterbtn.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filterbtn svg { width: 20px; height: 20px; }
.filters { background: var(--surface); padding: 6px 14px; }
.frow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 14px; gap: 12px; }
.frow + .frow { border-top: 1px solid var(--line); }
.frow .toggle { width: 44px; height: 26px; }
.frow .toggle i { width: 18px; height: 18px; }
.frow .toggle[aria-checked="true"] i { left: 21px; }
.pick { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.pick small { color: var(--muted); font-size: 12px; }
.pick .box { width: 26px; height: 26px; border: 1px solid var(--fg); display: grid; place-items: center; font-size: 14px; flex: none; }
.pick.on .box { background: var(--fg); color: var(--bg); }
.star { width: 40px; height: 40px; display: grid; place-items: center; font-size: 20px; flex: none; }
.chosen { display: flex; flex-direction: column; }
.chosenrow { display: grid; grid-template-columns: 1fr auto 32px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini-step { display: flex; align-items: center; border: 1px solid var(--line); }
.mini-step button { width: 32px; height: 32px; font-size: 16px; }
.mini-step span { min-width: 54px; text-align: center; font-family: var(--mono); font-size: 12px; }
.custom { border: 1px solid var(--fg); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.custom input { width: 100%; background: var(--surface); border: 1px solid var(--line); padding: 12px; font-size: 15px; }
.custom .chips .chip { padding: 6px 10px; font-size: 12px; }

.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.dialog h2 { margin-bottom: 4px; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 16px; font-size: 13px; font-weight: 600; max-width: calc(100% - 32px); }

/* Warm-up / cool-down animations (SVG, 200×200) */
.an { transform-box: view-box; transform-origin: 100px 100px; animation-duration: 2.6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.cool .an { animation-direction: reverse; }
.a-breath { animation-name: breath; }
@keyframes breath { 0%,100% { transform: scale(.82); } 50% { transform: scale(1); } }
.a-ring { animation-name: ring; animation-timing-function: ease-out; }
@keyframes ring { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.12); opacity: 0; } }
.a-fill { animation-name: fill; transform-origin: 100px 200px; }
@keyframes fill { 0% { transform: translateY(100%); } 70%,100% { transform: translateY(0); } }
.a-shard { animation-name: shard; }
@keyframes shard { 0% { transform: translate(var(--dx), var(--dy)); opacity: 0; } 45%,80% { transform: translate(0,0); opacity: 1; } 100% { transform: translate(0,0); opacity: 1; } }
.a-tile { animation-name: tile; }
@keyframes tile { 0% { opacity: 0; transform: scale(.3); } 40%,85% { opacity: 1; transform: scale(1); } 100% { opacity: 1; transform: scale(1); } }
.a-tile { transform-box: fill-box; transform-origin: center; }
.a-in { animation-name: inward; animation-timing-function: linear; }
@keyframes inward { 0% { transform: scale(1.15); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(.15); opacity: 0; } }

@media (prefers-reduced-motion: reduce) { *, .an { animation: none !important; transition: none !important; } }

  workouts.forEach(w => {

    b.innerHTML = `<span class="wname">${esc(w.name)}</span><span class="go">${t('go')}</span><span class="wex">${esc(w.ex.map(e => exName(e[0])).join(' · '))}</span><span class="wlast">${t('exN', w.ex.length)} · ${t('lastDone', a === null ? t('never') : t('ago', a))}</span>`;
    b.onclick = () => prepareWorkout(w); $('wlist').appendChild(b);
  });
  $('back').onclick = () => show('start');
  $('add').onclick = openCreate;
}

/* ---------- Workout ---------- */
let W = null;
function prepareWorkout(src) {
  W = { src, name: src.name, mode:'ready', start:null, phase:'idle', phaseStart:Date.now(), cur:0, open:{}, edit:null,
        ex: src.ex.map(([k, n]) => ({ k, target:n, sets:[], w: LAST[k] ? LAST[k][0] : 20, r: LAST[k] ? LAST[k][1] : 10 })) };
  renderW(); openW();
}
function openW() { $('wsheet').classList.remove('down'); $('wsheet').style.transform = ''; $('mini').hidden = true; }
function minimize() { $('wsheet').classList.add('down'); $('wsheet').style.transform = ''; if (W && W.mode !== 'review') $('mini').hidden = false; tick(); }
function closeW() { W = null; $('wsheet').classList.add('down'); $('mini').hidden = true; greetText = greeting(); if (tab === 'start') renderStart(); }

function setBar(html) { $('wbar').firstElementChild.innerHTML = html; $('wbar').hidden = !html; }
const curEx = () => W.ex[W.cur];
const allDone = () => W.ex.every(e => e.sets.length >= e.target);

function renderW() {
  const head = (right) => `<div class="whead"><button class="iconbtn" id="minbtn" aria-label="Minimieren">⌄</button><div><div class="eyebrow">${esc(W.name)}</div><div class="overall num" id="w-overall">${W.start ? mmss((Date.now()-W.start)/1000) : '00:00'}</div></div>${right || '<span></span>'}</div>`;
  let h = '';
  if (W.mode === 'ready') {
    h = head() + `<div><h1>${t('ready')}</h1><p class="hint" style="margin-top:8px">${t('readyHint')}</p></div><div>` +
      W.ex.map((e, i) => `<div class="readyex"><span class="idx num">${String(i+1).padStart(2,'0')}</span><div class="exname">${esc(exName(e.k))}<small>${t('sets', e.target)} · ${t('lastShort', isBW(e.k) ? t('bwLabel', e.w) : fmtW(e.w) + ' kg', e.r)}</small></div><span class="mv"><button data-mv="${i}:-1" ${i===0?'disabled':''} aria-label="hoch">↑</button><button data-mv="${i}:1" ${i===W.ex.length-1?'disabled':''} aria-label="runter">↓</button></span></div>`).join('') + '</div>';
    setBar(`<button class="mainbtn" id="startbtn">${t('start')}</button>`);
  } else if (W.mode === 'warmup' || W.mode === 'cooldown') {
    const cool = W.mode === 'cooldown';
    h = head() + `<div class="phase"><div class="pill">${t(W.mode)}</div></div><div class="animwrap">${animSVG(S.anim, cool)}</div><div class="phase"><div class="bigtime num" id="phasetime">00:00</div></div>`;
    setBar(cool ? `<button class="mainbtn" id="finishbtn">${t('finish')}</button>` : `<button class="mainbtn" id="warmdone">${t('warmDone')}</button>`);
  } else if (W.mode === 'train') {
    h = head() + `<div class="phase"><div class="pill ${W.phase==='rest'?'solid':''}">${t(W.phase === 'set' ? 'set' : 'rest')}</div><div class="bigtime num" id="phasetime">00:00</div></div><div>` + W.ex.map((e, i) => blockHTML(e, i)).join('') + `</div><button class="ghostbtn" id="endbtn">${t('endAbort')}</button>`;
    const e = curEx(), n = e.sets.length;
    let main;
    if (W.phase === 'set') main = `<button class="mainbtn" id="mainact" data-a="done">${t('setDone')}</button>`;
    else if (n < e.target) main = `<button class="mainbtn" id="mainact" data-a="start">${t('startSet', n+1)}</button>`;
    else if (!allDone()) main = `<button class="mainbtn" id="mainact" data-a="next">${t('nextEx')}</button>`;
    else main = `<button class="mainbtn" id="mainact" data-a="cool">${t('toCooldown')}</button><button class="textbtn" id="nocd">${t('finishNoCd')}</button>`;
    setBar(main);
  } else if (W.mode === 'review') {
    h = reviewHTML(); setBar(`<button class="mainbtn" id="donebtn">${t('done')}</button>`);
  }
  $('wbody').innerHTML = `<div class="inner">${h}</div>`;
  bindW(); tick();
}

function setVal(e, s) { return isBW(e.k) ? t('bwLabel', fmtW(s.w)).replace(/^\+?(-?[\d.,]+)/, m => m) : fmtW(s.w) + ' kg'; }
function inputsHTML(prefix, w, r, k) {
  return `<div class="steppers"><div class="stepper"><label for="${prefix}kg">${isBW(k) ? t('kgExtra') : t('kg')}</label><div class="ctl"><button data-st="${prefix}kg:-0.5" aria-label="minus">−</button><input id="${prefix}kg" inputmode="decimal" class="num" value="${fmtW(w)}"><button data-st="${prefix}kg:0.5" aria-label="plus">+</button></div></div>
    <div class="stepper"><label for="${prefix}reps">${t('reps')}</label><div class="ctl"><button data-st="${prefix}reps:-1" aria-label="minus">−</button><input id="${prefix}reps" inputmode="numeric" class="num" value="${r}"><button data-st="${prefix}reps:1" aria-label="plus">+</button></div></div></div>` + (isBW(k) ? `<div class="bwnote">${t('bwNote')}</div>` : '');
}
function blockHTML(e, i) {
  const n = e.sets.length, isCur = i === W.cur, complete = n >= e.target, open = isCur || W.open[i];
  const cls = 'block' + (isCur ? ' cur' : '') + (complete && !isCur ? ' done' : '');
  const upcoming = !isCur && !complete;
  let h = `<div class="${cls}"><div class="bhead" ${isCur ? '' : `data-tog="${i}" role="button" tabindex="0"`}><span class="idx num">${String(i+1).padStart(2,'0')}</span><span class="exname">${esc(exName(e.k))}${isCur ? `<small>${t('lastShort', isBW(e.k) ? t('bwLabel', LAST[e.k]?.[0] ?? 0) : fmtW(LAST[e.k]?.[0] ?? e.w) + ' kg', LAST[e.k]?.[1] ?? e.r)}</small>` : ''}</span>` +
    (upcoming ? `<span class="mv"><button data-wmv="${i}:-1" aria-label="hoch">↑</button><button data-wmv="${i}:1" aria-label="runter">↓</button></span>` : `<span class="stat num">${t('setsShort', n, e.target)}${complete ? ' ✓' : ''}</span>`) + `</div>`;
  if (open) {
    h += `<div class="setlist">`;
    e.sets.forEach((s, j) => {
      if (W.edit && W.edit[0] === i && W.edit[1] === j) h += `<div class="setrow2 active"><div class="row"><span class="idx num">${j+1}</span><button class="textbtn" data-saveedit="1" style="color:var(--fg)">${t('ok')}</button></div>${inputsHTML('ed', s.w, s.r, e.k)}</div>`;
      else h += `<button class="setrow2" data-edit="${i}:${j}"><span class="idx num">${j+1}</span><span class="sv num">${isBW(e.k) ? esc(t('bwLabel', fmtW(s.w))) : fmtW(s.w) + ' kg'} × ${s.r}</span><span class="ck">✓</span></button>`;
    });
    if (isCur && n < e.target) h += `<div class="setrow2 active"><div class="row"><span class="idx num">${n+1}</span>${W.phase === 'set' ? `<span class="running">${t('running')}</span>` : ''}</div>${inputsHTML('cu', e.w, e.r, e.k)}</div>`;
    for (let j = n + (isCur ? 1 : 0); j < e.target; j++) h += `<div class="setrow2 planned"><span class="idx num">${j+1}</span><span class="sv num">${isBW(e.k) ? esc(t('bwLabel', fmtW(e.w))) : fmtW(e.w) + ' kg'} × ${e.r}</span><span></span></div>`;
    h += `<button class="addset" data-addset="${i}">${t('addSet')}</button>`;
    if (!isCur && !complete) h += `<button class="switch" data-switch="${i}">${t('switchTo')}</button>`;
    h += `</div>`;
  }
  return h + `</div>`;
}

function bindW() {
  const q = s => $('wsheet').querySelectorAll(s);
  $('minbtn') && ($('minbtn').onclick = minimize);
  q('[data-mv]').forEach(b => b.onclick = () => { const [i, d] = b.dataset.mv.split(':').map(Number); [W.ex[i], W.ex[i+d]] = [W.ex[i+d], W.ex[i]]; renderW(); });
  q('[data-wmv]').forEach(b => b.onclick = ev => { ev.stopPropagation(); const [i, d] = b.dataset.wmv.split(':').map(Number); const j = i + d; if (j < 0 || j >= W.ex.length) return; const c = W.ex[W.cur]; [W.ex[i], W.ex[j]] = [W.ex[j], W.ex[i]]; W.cur = W.ex.indexOf(c); W.open = {}; renderW(); });
  q('[data-tog]').forEach(b => b.onclick = () => { const i = +b.dataset.tog; W.open[i] = !W.open[i]; renderW(); });
  q('[data-switch]').forEach(b => b.onclick = () => { W.cur = +b.dataset.switch; W.open = {}; W.edit = null; if (W.phase === 'set') W.phase = 'rest'; renderW(); });
  q('[data-addset]').forEach(b => b.onclick = () => { W.ex[+b.dataset.addset].target++; renderW(); });
  q('[data-edit]').forEach(b => b.onclick = () => { W.edit = b.dataset.edit.split(':').map(Number); renderW(); });
  q('[data-saveedit]').forEach(b => b.onclick = () => { readInputs(); W.edit = null; renderW(); });
  q('[data-st]').forEach(b => b.onclick = () => {
    const [id, d] = b.dataset.st.split(':'); const inp = $(id); const isKg = id.endsWith('kg');
    let v = (parseNum(inp.value) ?? 0) + parseFloat(d); if (!isKg) v = Math.max(1, Math.round(v));
    const k = id.startsWith('ed') ? W.ex[W.edit[0]].k : curEx().k; if (isKg && !isBW(k)) v = Math.max(0, v);
    inp.value = isKg ? fmtW(v) : v; readInputs(false);
  });
  q('.ctl input').forEach(inp => inp.onchange = () => { readInputs(); });
  $('startbtn') && ($('startbtn').onclick = () => { W.start = Date.now(); W.mode = 'warmup'; W.phaseStart = Date.now(); renderW(); });
  $('warmdone') && ($('warmdone').onclick = () => { W.mode = 'train'; W.phase = 'idle'; W.phaseStart = Date.now(); renderW(); });
  $('finishbtn') && ($('finishbtn').onclick = () => { W.mode = 'review'; W.end = Date.now(); renderW(); $('wbody').scrollTop = 0; });
  $('nocd') && ($('nocd').onclick = () => { W.mode = 'review'; W.end = Date.now(); renderW(); $('wbody').scrollTop = 0; });
  $('endbtn') && ($('endbtn').onclick = endDialog);
  $('donebtn') && ($('donebtn').onclick = saveWorkout);
  $('mainact') && ($('mainact').onclick = () => {
    readInputs(false); const e = curEx(), a = $('mainact').dataset.a;
    if (a === 'start') W.phase = 'set';
    else if (a === 'done') { e.sets.push({ w:e.w, r:e.r }); W.phase = 'rest'; }
    else if (a === 'next') { const order = [...W.ex.keys()]; const nx = order.slice(W.cur+1).concat(order.slice(0, W.cur)).find(i => W.ex[i].sets.length < W.ex[i].target); W.cur = nx; W.open = {}; }
    else if (a === 'cool') { W.mode = 'cooldown'; }
    if (a !== 'next') W.phaseStart = Date.now();
    renderW();
  });
}
function readInputs(rerender) {
  const rd = (p, o) => { const kg = $(p+'kg'), rp = $(p+'reps'); if (!kg) return; const w = parseNum(kg.value), r = parseNum(rp.value); if (w !== null) o.w = Math.round(w * 100) / 100; if (r !== null) o.r = Math.max(1, Math.round(r)); };
  if (W.edit) rd('ed', W.ex[W.edit[0]].sets[W.edit[1]]);
  rd('cu', curEx());
  if (rerender) renderW();
}
function endDialog() {
  const ov = $('overlay');
  ov.innerHTML = `<div class="dialog" role="dialog"><h2>${t('dlgTitle')}</h2><button class="mainbtn" id="d-save">${t('dlgSave')}</button><button class="ghostbtn" id="d-del">${t('dlgDiscard')}</button><button class="textbtn" id="d-cont" style="align-self:center">${t('dlgCont')}</button></div>`;
  ov.hidden = false;
  $('d-save').onclick = () => { ov.hidden = true; W.mode = 'review'; W.end = Date.now(); renderW(); $('wbody').scrollTop = 0; };
  $('d-del').onclick = () => { ov.hidden = true; closeW(); toast(t('discarded')); };
  $('d-cont').onclick = () => { ov.hidden = true; };
}

function stats() {
  const sets = W.ex.flatMap(e => e.sets.map(s => ({ ...s, k:e.k, ew: effW(e.k, s.w) })));
  const vol = sets.reduce((a, s) => a + Math.max(0, s.ew) * s.r, 0);
  return { sets, vol };
}
function reviewHTML() {
  const { sets, vol } = stats(); const dur = Math.max(1, Math.round(((W.end || Date.now()) - (W.start || Date.now())) / 60000));
  const prev = HISTORY.filter(h => h.wid === W.src.id).sort((a,b) => a.ago - b.ago)[0]; const diff = vol - (prev ? prev.vol : 0);
  let hl = '';
  if (sets.length) {
    const valid = sets.filter(s => s.ew > 0);
    hl += `<div><b class="num">${diff >= 0 ? '+' : '−'}${fmt(Math.abs(Math.round(diff)))} kg</b><span>${t('hlVol', diff)}</span></div>`;
    if (valid.length) {
      const best = valid.reduce((b, s) => e1rm(s.ew, s.r) > e1rm(b.ew, b.r) ? s : b);
      const lastE = LAST[best.k] ? e1rm(effW(best.k, LAST[best.k][0]), LAST[best.k][1]) : 0;
      const bv = fmt(Math.round(e1rm(best.ew, best.r))) + ' kg';
      hl += `<div><b class="num">${bv}</b><span>${e1rm(best.ew, best.r) > lastE ? esc(t('hlPR', exName(best.k))) : esc(t('hlBest', exName(best.k), fmtW(best.w) + ' × ' + best.r))}</span></div>`;
    }
    hl += `<div><b class="num">${sets.length}</b><span>${t('hlSets')}</span></div><div><b class="num">+${Math.max(5, Math.round(vol / 250))}</b><span>${t('ptsEarned')}</span></div>`;
  }
  return `<div><div class="eyebrow">${esc(W.name)}</div><h1>${t('strong')}</h1></div>
    <div class="rv-hero"><div class="rv-oct"><span>${t('movedBig')}</span><b class="num">${vol >= 1000 ? fmt(vol/1000, 1) + ' t' : fmt(Math.round(vol)) + ' kg'}</b><span>${t('min', dur)} · ${t('setsN', sets.length)}</span></div></div>
    <div><h2 style="margin-bottom:4px">${t('highlights')}</h2><div class="hl">${hl || `<p class="hint" style="padding:14px 0">${t('emptyReview')}</p>`}</div></div>`;
}
function saveWorkout() {
  const { sets, vol } = stats();
  if (sets.length) { HISTORY.push({ ago:0, wid:W.src.id, vol }); W.ex.forEach(e => { if (e.sets.length) { const l = e.sets[e.sets.length-1]; LAST[e.k] = [l.w, l.r]; } }); }
  closeW();
}

function tick() {
  if (!W) return;
  const all = W.start ? (Date.now() - W.start) / 1000 : 0, ph = (Date.now() - W.phaseStart) / 1000;
  const o = $('w-overall'); if (o && W.mode !== 'review') o.textContent = mmss(all);
  const p = $('phasetime'); if (p) p.textContent = mmss(ph);
  if (!$('mini').hidden) {
    const label = W.mode === 'ready' ? t('ready') : W.mode === 'train' ? t(W.phase === 'set' ? 'set' : 'rest') : t(W.mode);
    $('m-phase').textContent = label + (W.start ? ' · ' + mmss(all) : '');
    $('m-name').textContent = W.mode === 'train' ? exName(curEx().k) : W.name;
    $('m-time').textContent = W.mode === 'ready' ? '' : mmss(ph);
  }
}
setInterval(tick, 250);
$('mini').onclick = openW;
(() => { // drag handle to minimise
  let y0 = null, dy = 0; const h = $('handle'), s = $('wsheet');
  h.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; s.style.transition = 'none'; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); s.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; y0 = null; s.style.transition = ''; if (dy > 110) minimize(); else s.style.transform = ''; };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
})();

      ${O.filter ? `<div class="filters"><div class="frow"><span>${t('onlyFav')} ★</span><button class="toggle" role="switch" aria-checked="${O.onlyFav}" data-ff="fav"><i></i></button></div>${Object.entries(t('groups')).map(([g, l]) => `<div class="frow"><span>${l}</span><button class="toggle" role="switch" aria-checked="${O.groups.has(g)}" data-ff="${g}"><i></i></button></div>`).join('')}</div>` : ''}
      <div id="o-list"></div></div>`;
    renderPickList(); setOBar('');

  }
}
function renderPickList() {
  const L = $('o-list'); L.innerHTML = '';
  if (O.mode === 'create') {
    Object.keys(EX).filter(k => exMatches(k, O.q)).forEach(k => {
      const on = O.picked.some(p => p[0] === k); const x = document.createElement('button'); x.className = 'pick' + (on ? ' on' : '');
      x.innerHTML = `<span>${esc(exName(k))}<br><small>${t('groups')[EX[k].g]} · ${t('eqs')[EX[k].eq]}${EX[k].custom ? ' · ' + t('own') : ''}</small></span><span class="box">${on ? '✓' : ''}</span>`;
      x.onclick = () => { const i = O.picked.findIndex(p => p[0] === k); i >= 0 ? O.picked.splice(i, 1) : O.picked.push([k, 3]); renderO(); };
      L.appendChild(x);
    });
  } else {
    const ks = Object.keys(EX).filter(k => exMatches(k, O.q) && O.groups.has(EX[k].g) && (!O.onlyFav || S.fav.has(k)))
      .sort((a, b) => (lastAgoEx(a) ?? 1e9) - (lastAgoEx(b) ?? 1e9));
    ks.forEach(k => {
      const a = lastAgoEx(k); const x = document.createElement('div'); x.className = 'pick';
      x.innerHTML = `<button style="flex:1;text-align:left;min-width:0" data-sel="1">${esc(exName(k))}<br><small>${a === null ? t('notTrained') : t('lastDone', t('ago', a))}</small></button><button class="star" aria-label="Favorit">${S.fav.has(k) ? '★' : '☆'}</button>`;
      x.querySelector('[data-sel]').onclick = () => { S.chartKey = k; closeO(); renderProgress(); };
      x.querySelector('.star').onclick = () => { S.fav.has(k) ? S.fav.delete(k) : S.fav.add(k); renderPickList(); };
      L.appendChild(x);
    });
  }
}

/* ---------- Progress ---------- */
let calOpen = false, calMonth = 0, selDay = null;
function seriesFor(k) {
  const l = LAST[k]; if (!l) return null; const ew = effW(k, l[0]); if (ew <= 0) return null;
  const base = e1rm(ew, l[1]); let seed = k.length * 7;
  return Array.from({length:10}, (_, i) => { seed = (seed * 9301 + 49297) % 233280; const noise = (seed / 233280 - .5) * .025; return Math.round(base * (0.86 + 0.14 * Math.pow(i / 9, .8) + noise) * 2) / 2; });
}
function forecast(d) {
  const ys = d.slice(-8), xs = ys.map((_, i) => Math.log(i + 1)); const n = ys.length;
  const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  const b = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0); const a = my - b * mx;
  const sd = Math.sqrt(ys.reduce((s, y, i) => s + (y - (a + b * xs[i])) ** 2, 0) / n) || 1;
  const shift = ys[n-1] - (a + b * Math.log(n));
  return Array.from({length:6}, (_, h) => { const y = a + b * Math.log(n + h + 1) + shift; return { y, band: sd * (1 + .35 * (h + 1)) }; });
}
function renderProgress() {
  const fav = [...S.fav].slice(0, 4);
  const lastW = workouts.map(w => [w, lastAgoW(w.id)]).filter(x => x[1] !== null);
  $('v-progress').innerHTML = `<div class="inner">
    <h1>${t('progress')}</h1>
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="row"><h2>${t('history')}</h2><button class="textbtn" id="calbtn" style="color:var(--fg)">${calOpen ? t('less') + ' ▴' : t('calendar') + ' ▾'}</button></div>
      ${calOpen ? calHTML() : `<div class="days">${Array.from({length:7}, (_, i) => dayTile(6 - i)).join('')}</div>`}
      <div class="daydetail" id="daydetail">${dayDetail(selDay ?? 0)}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px"><h2>${t('lastTimes')}</h2><div class="lastrow">${lastW.map(([w, a]) => `<span><b>${esc(w.name)}</b> · ${t('ago', a)}</span>`).join('')}</div></div>
    <div class="statgrid num"><div><b>11</b><span>${t('wMonth')}</span></div><div><b>${fmt(48.2,1)} t</b><span>${t('movedMonth')}</span></div><div><b>6</b><span>${t('prs')}</span></div><div><b>4</b><span>${t('streak')}</span></div></div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div><h2>${t('maxStrength')}</h2><p class="hint" style="margin-top:6px">${t('maxHint')}</p></div>
      <button class="exsel" id="exsel">${esc(exName(S.chartKey))} <span>▾</span></button>
      ${fav.length ? `<div class="chips">${fav.map(k => `<button class="chip ${k===S.chartKey?'on':''}" data-ck="${k}">★ ${esc(exName(k))}</button>`).join('')}</div>` : ''}
      <div id="chartwrap"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px"><h2 style="margin-bottom:6px">${t('pbs')}</h2><div>${pbHTML()}</div></div>
  </div>`;
  $('calbtn').onclick = () => { calOpen = !calOpen; renderProgress(); };
  $('exsel').onclick = openPicker;
  document.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => { S.chartKey = b.dataset.ck; renderProgress(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { selDay = +b.dataset.day; document.querySelectorAll('[data-day]').forEach(x => x.classList.toggle('sel', x === b)); $('daydetail').innerHTML = dayDetail(selDay); });
  $('calprev') && ($('calprev').onclick = () => { calMonth--; renderProgress(); });
  $('calnext') && ($('calnext').onclick = () => { if (calMonth < 0) { calMonth++; renderProgress(); } });
  renderChart();
}
const histOn = ago => HISTORY.find(h => h.ago === ago);
function dayTile(ago) { const d = dayDate(ago), h = histOn(ago); return `<button class="day ${h?'on':''} ${ago===0?'today':''} ${selDay===ago?'sel':''}" data-day="${ago}"><small>${t('wd')[(d.getDay()+6)%7]}</small><b class="num">${d.getDate()}</b><i>${h ? code(h.wid) : ''}</i></button>`; }
function dayDetail(ago) { const d = dayDate(ago), h = histOn(ago); const ds = d.toLocaleDateString(loc(), { weekday:'short', day:'2-digit', month:'2-digit' }); if (!h) return `${esc(ds)} · ${t('noWorkout')}`; const w = wById(h.wid); return `<b>${esc(ds)} · ${esc(w ? w.name : '')}</b> · ${t('exN', w ? w.ex.length : 0)} · ${fmt(h.vol/1000,1)} t`; }
function calHTML() {
  const today = dayDate(0); const m = new Date(today.getFullYear(), today.getMonth() + calMonth, 1);
  const first = (m.getDay() + 6) % 7, days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  let g = t('wd').map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < first; i++) g += '<button class="out" tabindex="-1"></button>';
  for (let dd = 1; dd <= days; dd++) { const d = new Date(m.getFullYear(), m.getMonth(), dd, 12); const ago = Math.round((today - d) / 864e5); const h = ago >= 0 ? histOn(ago) : null;
    g += ago < 0 ? `<button disabled style="opacity:.3">${dd}</button>` : `<button class="${h?'on':''} ${ago===0?'today':''} ${selDay===ago?'sel':''}" data-day="${ago}">${dd}<i>${h ? code(h.wid) : ''}</i></button>`; }
  return `<div class="cal"><div class="row"><button class="iconbtn" id="calprev" aria-label="zurück" style="width:36px;height:36px;font-size:16px">‹</button><b>${m.toLocaleDateString(loc(), { month:'long', year:'numeric' })}</b><button class="iconbtn" id="calnext" aria-label="vor" style="width:36px;height:36px;font-size:16px;${calMonth<0?'':'opacity:.3'}">›</button></div><div class="calgrid">${g}</div></div>`;
}
function pbHTML() {
  return Object.keys(LAST).filter(k => lastAgoEx(k) !== null && effW(k, LAST[k][0]) > 0).map(k => ({ k, ago:lastAgoEx(k) + (k.length % 3) * 7, w:LAST[k][0], r:LAST[k][1] }))
    .sort((a, b) => a.ago - b.ago).slice(0, 6).map(p => `<div class="pb"><b>${esc(exName(p.k))}</b><span class="pw num">${isBW(p.k) ? esc(t('bwLabel', fmtW(p.w))) : fmtW(p.w) + ' kg'} × ${p.r}</span><small>${dShort(dayDate(p.ago))}</small><small>${t('approx', fmt(Math.round(e1rm(effW(p.k, p.w), p.r))))}</small></div>`).join('');
}
function renderChart() {
  const wrap = $('chartwrap'); const d = seriesFor(S.chartKey);
  if (!d) { wrap.innerHTML = `<div class="empty">${t('bwEmpty')}</div>`; return; }
  const f = forecast(d); const all = d.length + f.length;
  const W0 = 340, H0 = 230, L = 36, R = 12, Tp = 34, B = 26;
  const vals = d.concat(f.map(p => p.y + p.band), f.map(p => p.y - p.band));
  const lo = Math.floor((Math.min(...vals) - 2) / 10) * 10, hi = Math.ceil((Math.max(...vals) + 2) / 10) * 10;
  const x = i => L + i * (W0 - L - R) / (all - 1), y = v => Tp + (hi - v) * (H0 - Tp - B) / (hi - lo);
  const step = (hi - lo) > 40 ? 20 : 10;
  let s = '';
  for (let v = lo; v <= hi; v += step) s += `<line x1="${L}" x2="${W0-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${v}</text>`;
  const li = d.length - 1;
  s += `<line x1="${x(li)}" x2="${x(li)}" y1="${Tp}" y2="${H0-B}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
  const band = [[x(li), y(d[li])]].concat(f.map((p, h) => [x(li+1+h), y(p.y + p.band)])).concat(f.map((p, h) => [x(li+1+h), y(p.y - p.band)]).reverse());
  s += `<polygon points="${band.map(p => p.join(',')).join(' ')}" fill="var(--fg)" opacity=".07"/>`;
  const pts = d.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  s += `<polygon points="${x(0)},${H0-B} ${pts} ${x(li)},${H0-B}" fill="var(--fg)" opacity=".08"/><polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<polyline points="${x(li)},${y(d[li])} ${f.map((p, h) => `${x(li+1+h)},${y(p.y)}`).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 5"/>`;
  const wk = i => dShort(dayDate((li - i) * 7));
  [0, li, all - 1].forEach((i, n) => s += `<text x="${x(i)}" y="${H0-6}" text-anchor="${n===0?'start':n===2?'end':'middle'}" font-size="10" font-family="var(--mono)" fill="var(--muted)">${wk(i)}</text>`);
  s += `<g id="scrub"></g>`;
  wrap.innerHTML = `<svg class="chart" id="chart" viewBox="0 0 ${W0} ${H0}" role="img" aria-label="${esc(exName(S.chartKey))}">${s}</svg><div class="legend" style="margin-top:8px"><span><i></i>${t('trend')}</span><span><i class="dash"></i>${t('forecast')}</span><span>· ${t('scrubHint')}</span></div>`;
  const svg = $('chart'), sc = $('scrub');
  const showAt = i => {
    const isF = i > li, v = isF ? f[i-li-1].y : d[i], X = x(i), Y = y(v);
    const label = `${fmt(Math.round(v*2)/2, v % 1 ? 1 : 0)} kg · ${wk(i)}${isF ? ' · ' + t('forecastTag') : ''}`;
    const anchor = X < 110 ? 'start' : X > W0 - 110 ? 'end' : 'middle';
    sc.innerHTML = `<line x1="${X}" x2="${X}" y1="${Tp-6}" y2="${H0-B}" stroke="var(--fg)" stroke-dasharray="3 3"/><circle cx="${X}" cy="${Y}" r="5.5" fill="${isF ? 'var(--bg)' : 'var(--fg)'}" stroke="var(--fg)" stroke-width="2"/><text x="${X}" y="${Tp-12}" text-anchor="${anchor}" font-size="13" font-weight="800" font-family="var(--body)" fill="var(--fg)">${label}</text>`;
  };
  const onMove = e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W0; showAt(Math.max(0, Math.min(all - 1, Math.round((px - L) / ((W0 - L - R) / (all - 1)))))); };
  svg.addEventListener('pointerdown', onMove); svg.addEventListener('pointermove', onMove);
  showAt(li);
}

/* ---------- Settings ---------- */
let bwInfoOpen = false;
function renderSettings() {
  $('v-settings').innerHTML = `<div class="inner"><h1>${t('settings')}</h1><div>
    <div class="setrow"><div><b>${t('language')}</b><p>${t('langHint')}</p></div><div class="seg"><button id="l-de" class="${S.lang==='de'?'on':''}">DE</button><button id="l-en" class="${S.lang==='en'?'on':''}">EN</button></div></div>
    <div class="setrow"><div><b>${t('invert')}</b><p>${t('invertHint')}</p></div><button class="toggle" id="inv" role="switch" aria-checked="${S.inverted}" aria-label="${t('invert')}"><i></i></button></div>
    <div class="setrow"><div><b>${t('bodyweight')}</b><button class="info" id="bwi" aria-label="Info">i</button><p>${t('bwHint')}</p></div><label class="kgin"><input id="bw" inputmode="decimal" class="num" placeholder="—" value="${S.bodyweight ? fmtW(S.bodyweight) : ''}"><span>kg</span></label></div>
    ${bwInfoOpen ? `<div class="infobox">${t('bwInfo')}</div>` : ''}
    <div class="setrow"><div><b>${t('bwPoints')}</b><p>${t('bwPointsHint')}</p></div><button class="toggle" id="bwp" role="switch" aria-checked="${S.bwPoints}" ${S.bodyweight ? '' : 'disabled'} aria-label="${t('bwPoints')}"><i></i></button></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px"><div><b>${t('animTitle')}</b><p class="hint" style="margin-top:4px">${t('animHint')}</p></div>
      <div class="anims">${Object.keys(T.de.anims).map(k => `<button class="animopt ${S.anim===k?'on':''}" data-anim="${k}">${animSVG(k, false)}<span>${t('anims')[k]}</span></button>`).join('')}</div></div>
  </div>`;
  $('l-de').onclick = () => setLang('de'); $('l-en').onclick = () => setLang('en');
  $('inv').onclick = () => { S.inverted = !S.inverted; $('app').classList.toggle('inverted', S.inverted); document.body.style.background = S.inverted ? '#f3f3ef' : '#0b0b0a'; renderSettings(); };
  $('bwi').onclick = () => { bwInfoOpen = !bwInfoOpen; renderSettings(); };
  $('bw').onchange = e => { const v = parseNum(e.target.value); S.bodyweight = v && v > 0 ? v : null; if (!S.bodyweight) S.bwPoints = false; renderSettings(); };
  $('bwp').onclick = () => { S.bwPoints = !S.bwPoints; renderSettings(); };
  document.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => { S.anim = b.dataset.anim; renderSettings(); if (W && (W.mode === 'warmup' || W.mode === 'cooldown')) renderW(); });
}
function setLang(l) { S.lang = l; greetText = greeting(); document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t)); renderSettings(); if (W) renderW(); }

/* keep bottom bars above the on-screen keyboard */
function kbFix() { const vv = window.visualViewport; if (!vv) return; const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', off + 'px'); }
if (window.visualViewport) { visualViewport.addEventListener('resize', kbFix); visualViewport.addEventListener('scroll', kbFix); }

greetText = greeting();
document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
show('start');
</script>
