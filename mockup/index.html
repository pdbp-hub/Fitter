<title>Fitter Entwurf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app. Scrolling screen + fixed bottom nav with the decagon in the centre; workout runs in a sheet with a fixed header and minimises to a floating bar. */
:root {
  --bg: #0b0b0a; --fg: #f3f3ef; --surface: #161615; --line: #2a2a27; --muted: #8d8d86; --dim: #55554f; --offoct: #4a4a45;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --dec: polygon(100% 50%, 90.45% 79.39%, 65.45% 97.55%, 34.55% 97.55%, 9.55% 79.39%, 0 50%, 9.55% 20.61%, 34.55% 2.45%, 65.45% 2.45%, 90.45% 20.61%);
  --kb: 0px;
  color-scheme: dark;
}
.inverted { --bg: #f3f3ef; --fg: #0b0b0a; --surface: #e7e7e1; --line: #d3d3cc; --muted: #6c6c66; --dim: #a9a9a2; --offoct: #b9b9b2; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: #0b0b0a; color: #f3f3ef; font-family: var(--body); overflow: hidden; }
button, input { font: inherit; color: inherit; border-radius: 0; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
input::placeholder { color: var(--dim); }

.app { position: fixed; inset: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
.screen { flex: 1; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(130px + env(safe-area-inset-bottom, 0px)); }
.inner { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-stretch: 112%; font-weight: 900; font-size: 34px; line-height: .95; text-transform: uppercase; margin: 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.45; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); font-size: 20px; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.textbtn { font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: var(--muted); padding: 8px 0; }
.dec { clip-path: var(--dec); }
.info { width: 20px; height: 20px; border: 1px solid var(--muted); border-radius: 50%; font-family: var(--mono); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; margin-left: 6px; vertical-align: middle; color: var(--muted); }
.infobox { font-size: 13px; line-height: 1.5; background: var(--surface); padding: 12px 14px; border-left: 2px solid var(--fg); }
.infobox code { font-family: var(--mono); font-size: 12px; }
.pulse { animation: pulse 2.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

/* Start */
#v-start { display: flex; flex-direction: column; }
#v-start .inner { flex: 1; justify-content: space-between; gap: 18px; width: 100%; }
.ptsline { display: flex; align-items: baseline; justify-content: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.ptsline b { font-family: var(--display); font-stretch: 75%; font-weight: 900; font-size: 30px; line-height: 1; }
.ptsline span { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.hero { display: grid; place-items: center; }
.octa { width: min(80vw, 46vh, 340px); max-width: 100%; aspect-ratio: 1; background: var(--fg); color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 14%; }
.octa:active { animation: none; transform: scale(.96); }
.octa .greet { font-weight: 500; font-size: 14px; line-height: 1.3; max-width: 22ch; }
.octa .cta { font-family: var(--display); font-weight: 900; font-stretch: 125%; font-size: clamp(28px, 9vw, 42px); line-height: .9; text-transform: uppercase; }
.octa .tap { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; }
.resume { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--fg); padding: 12px 14px; text-align: left; width: 100%; }
.resume b { font-size: 14px; }
.resume small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.weekstats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.weekstats div { padding: 14px 4px; display: flex; flex-direction: column; gap: 4px; }
.weekstats div + div { border-left: 1px solid var(--line); padding-left: 12px; }
.weekstats b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 26px; }
.weekstats span { font-size: 11px; color: var(--muted); }

/* Workout list */
.newbtn { width: 100%; padding: 14px; border: 1px dashed var(--fg); display: flex; justify-content: center; gap: 10px; font-family: var(--display); font-stretch: 110%; font-weight: 900; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
.witem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; align-items: center; }
.witem:first-child { border-top: 1px solid var(--line); }
.wname { font-family: var(--display); font-stretch: 110%; font-weight: 900; font-size: 24px; text-transform: uppercase; line-height: 1; }
.wex { grid-column: 1; font-size: 13px; color: var(--muted); line-height: 1.4; }
.wlast { grid-column: 1; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.go { grid-row: 1 / span 3; grid-column: 2; width: 60px; height: 60px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-family: var(--display); font-stretch: 125%; font-weight: 900; font-size: 17px; }

/* Placeholder icons */
.ico { width: 34px; height: 34px; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.ico svg { width: 22px; height: 22px; }

/* Progress */
.strip-wrap { position: relative; }
.strip { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 2px; }
.strip::-webkit-scrollbar { display: none; }
.day { flex: 0 0 calc((100% - 36px) / 7); scroll-snap-align: start; border: 1px solid var(--line); padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.day small { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
.day b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 18px; }
.day.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.day.on small { color: var(--bg); opacity: .7; }
.day.today { border-color: var(--fg); }
.day.sel { outline: 2px solid var(--fg); outline-offset: 2px; }
.today-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: var(--fg); color: var(--bg); font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 10px 10px; box-shadow: -10px 0 18px var(--bg); }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calgrid .wd { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: center; padding-bottom: 4px; }
.calgrid button { aspect-ratio: 1; border: 1px solid var(--line); font-size: 13px; min-width: 0; }
.calgrid button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.calgrid button.out { visibility: hidden; }
.calgrid button.today { border-color: var(--fg); }
.calgrid button.sel { outline: 2px solid var(--fg); outline-offset: 2px; }
.daycard { border-top: 2px solid var(--fg); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.daystats { display: flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.daystats b { color: var(--fg); }
.detail-ex { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
.detail-ex .ico { grid-row: span 2; }
.detail-ex b { font-size: 14px; }
.detail-ex span { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; }
.morebtn { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; padding: 6px 0; align-self: flex-start; }
.morebtn .mdec { width: 26px; height: 26px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 13px; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.statgrid div { background: var(--bg); padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.statgrid b { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 28px; }
.statgrid span { font-size: 12px; color: var(--muted); }
.exsel { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; border-bottom: 2px solid var(--fg); padding-bottom: 10px; }
.exsel b { font-family: var(--display); font-stretch: 105%; font-weight: 900; font-size: 26px; text-transform: uppercase; line-height: 1; min-width: 0; }
.exsel .drop { width: 40px; height: 40px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 16px; flex: none; }
.favs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fav { border: 1px solid var(--line); padding: 9px 6px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fav.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chartbox { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.chartbox + .chartbox { border-top: 1px solid var(--line); padding-top: 16px; }
.charthead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.charthead h2 { font-size: 13px; }
.charthead .val { font-family: var(--mono); font-size: 12px; font-weight: 700; text-align: right; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); font-family: var(--mono); align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 22px; border-top: 2px solid var(--fg); vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }
.empty { border: 1px dashed var(--line); padding: 20px 16px; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
.pb { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.pb:first-child { border-top: 1px solid var(--line); }
.pb b { font-weight: 700; font-size: 15px; }
.pb .pw { font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 22px; text-align: right; }
.pb small { color: var(--muted); font-size: 12px; }
.pb small:last-child { text-align: right; }

/* Settings */
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.setrow:first-child { border-top: 1px solid var(--line); }
.setrow p { margin: 4px 0 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
.setrow > div:first-child { min-width: 0; }
.seg { display: flex; border: 1px solid var(--fg); flex: none; }
.seg button { padding: 8px 14px; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.seg button.on { background: var(--fg); color: var(--bg); }
.toggle { width: 52px; height: 30px; border: 1px solid var(--fg); position: relative; flex: none; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; background: var(--fg); transition: left .2s; }
.toggle[aria-checked="true"] { background: var(--fg); }
.toggle[aria-checked="true"] i { left: 25px; background: var(--bg); }
.toggle:disabled { opacity: .3; }
.kgin { display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid var(--fg); flex: none; }
.kgin input { width: 64px; background: none; border: 0; text-align: right; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 24px; padding: 2px 0; }
.anims { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.animopt { border: 1px solid var(--line); padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; min-width: 0; }
.animopt svg { width: 48px; height: 48px; }
.animopt.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--bg); border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); padding-top: 8px; }
.nav .navrow { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }
.navbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
.navbtn.on { color: var(--fg); }
.navbtn svg { width: 24px; height: 24px; }
.navoct { width: 80px; height: 80px; margin-top: -30px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-family: var(--display); font-stretch: 125%; font-weight: 900; font-size: 15px; }
.navoct.off { background: var(--offoct); }

/* Mini player */
.mini { position: fixed; z-index: 19; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin: 0 auto; background: var(--fg); color: var(--bg); display: flex; align-items: center; gap: 14px; padding: 14px 18px; text-align: left; box-shadow: 0 12px 34px rgba(0,0,0,.4); }
.mini > div { min-width: 0; }
.mini .mphase { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.mini .mname { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .mtime { margin-left: auto; font-family: var(--display); font-stretch: 70%; font-weight: 800; font-size: 30px; }

/* Sheets */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.sheet.down { transform: translateY(105%); pointer-events: none; }
.sheet .handle { padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 4px; display: grid; place-items: center; touch-action: none; cursor: grab; flex: none; }
.sheet .handle i { width: 44px; height: 5px; background: var(--line); }
.sheet .screen { padding-top: 12px; padding-bottom: 150px; }
#osheet { z-index: 32; }
#osheet .screen { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.bar { position: absolute; left: 0; right: 0; bottom: var(--kb); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 28px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to bottom, transparent, var(--bg) 40%); }
.bar > div { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.mainbtn { width: 100%; padding: 18px; background: var(--fg); color: var(--bg); font-family: var(--display); font-stretch: 120%; font-weight: 900; font-size: 18px; text-transform: uppercase; }
.mainbtn:active { transform: scale(.98); }
.ghostbtn { width: 100%; padding: 14px; border: 1px solid var(--fg); font-weight: 700; font-size: 14px; }

.whead { flex: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.whead > div { max-width: 480px; margin: 0 auto; }
.wtop { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; text-align: center; }
.wtop .overall { font-family: var(--mono); font-size: 13px; font-weight: 700; margin-top: 2px; }
.wphase { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 4px; }
.wphase svg { width: 58px; height: 58px; }
.wphase .ptime { display: flex; align-items: baseline; gap: 10px; }
.wphase .plabel { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.wphase .pval { font-family: var(--display); font-stretch: 62%; font-weight: 900; font-size: 46px; line-height: .9; }
.bigtime { font-family: var(--display); font-stretch: 62%; font-weight: 900; font-size: clamp(88px, 30vw, 130px); line-height: .9; text-align: center; }
.pill { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--fg); padding: 4px 10px; align-self: center; }

.sortlist { display: flex; flex-direction: column; }
.srow { display: grid; grid-template-columns: 28px auto minmax(0,1fr) 40px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); background: var(--bg); transition: transform .15s; }
.srow.dragging, .block.dragging { transition: none; z-index: 5; position: relative; box-shadow: 0 8px 24px rgba(0,0,0,.45); outline: 1px solid var(--fg); }
.grip { width: 40px; height: 40px; display: grid; place-items: center; touch-action: none; cursor: grab; color: var(--muted); }
.grip svg { width: 20px; height: 20px; }
.idx { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.exname { font-weight: 700; font-size: 15px; min-width: 0; }
.exname small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }

.block { border-bottom: 1px solid var(--line); background: var(--bg); transition: transform .15s; }
.bhead { display: grid; grid-template-columns: 28px auto minmax(0,1fr) auto 40px; gap: 10px; align-items: center; padding: 12px 0; }
.bhead .stat { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.bhead .tapzone { text-align: left; min-width: 0; }
.block.cur .exname { font-family: var(--display); font-stretch: 100%; font-weight: 900; font-size: 21px; text-transform: uppercase; line-height: 1.05; hyphens: auto; overflow-wrap: anywhere; }
.exname, .wname, .exsel b { hyphens: auto; overflow-wrap: anywhere; }
.block.done .exname { color: var(--muted); }
.setlist { display: flex; flex-direction: column; padding-bottom: 12px; }
.set { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 10px; align-items: center; padding: 11px 10px; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.set .sv { font-family: var(--display); font-stretch: 85%; font-weight: 800; font-size: 19px; }
.set .st { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.set.planned { color: var(--dim); }
.set.planned .sv { font-weight: 600; }
.set.active { background: var(--fg); color: var(--bg); display: flex; flex-direction: column; align-items: stretch; gap: 10px; padding: 12px; border-top: 0; }
.set.edit { display: flex; flex-direction: column; align-items: stretch; gap: 10px; outline: 1px solid var(--fg); outline-offset: -1px; }
.activehead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.activehead .lbl { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.reset { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13px; font-weight: 700; border: 1px solid currentColor; padding: 5px 8px; }
.steppers { display: grid; grid-template-columns: 1.25fr 1fr; gap: 8px; }
.stepper { display: flex; flex-direction: column; gap: 4px; }
.stepper label { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
.ctl { display: flex; align-items: center; gap: 4px; }
.ctl button { width: 34px; height: 42px; border: 1px solid currentColor; font-size: 18px; flex: none; opacity: .6; }
.ctl input { width: 100%; min-width: 0; background: transparent; border: 0; border-bottom: 2px solid currentColor; text-align: center; font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 28px; padding: 4px 0; }
.bwnote { font-size: 11px; opacity: .7; }
.addset { font-size: 13px; font-weight: 700; padding: 10px; text-align: left; border-top: 1px solid var(--line); }

.animwrap { display: grid; place-items: center; padding-block: 8px; }
.animwrap svg { width: min(62vw, 250px); height: auto; max-width: 100%; }

/* Review */
.slogan { font-family: var(--display); font-stretch: 112%; font-weight: 900; font-size: 30px; line-height: .95; text-transform: uppercase; text-wrap: balance; margin: 0; }

.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.cmp { display: flex; flex-direction: column; gap: 8px; }

.cmpbar i { display: block; height: 14px; background: var(--fg); }
.cmpbar i.prev { background: transparent; border: 1px solid var(--fg); }
.cmpbar span { font-family: var(--mono); font-weight: 700; }
.rvex { border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
.rvex .row b { font-size: 15px; }
.rvex .delta { font-family: var(--mono); font-size: 12px; font-weight: 700; }
.rvsets { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; }

/* Create / picker */
.field { width: 100%; background: none; border: 0; border-bottom: 2px solid var(--fg); padding: 10px 0; font-family: var(--display); font-stretch: 110%; font-weight: 900; font-size: 26px; text-transform: uppercase; }
.searchrow { display: flex; gap: 8px; }

.frow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 14px; gap: 12px; }

.pick .pmain { text-align: left; min-width: 0; }

.pick .box { width: 28px; height: 28px; border: 1px solid var(--fg); display: grid; place-items: center; font-size: 14px; flex: none; }
.pick.on .box { background: var(--fg); color: var(--bg); }

.mini-step span { min-width: 58px; text-align: center; font-family: var(--mono); font-size: 12px; }

.custom input { width: 100%; background: var(--surface); border: 1px solid var(--line); padding: 12px; font-size: 15px; }

.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

/* Warm-up / cool-down animations (SVG, 200×200) */
.an { transform-box: view-box; transform-origin: 100px 100px; animation-duration: 2.6s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.cool .an { animation-direction: reverse; }
.paused .an { animation-play-state: paused; }
.a-breath { animation-name: breath; }
@keyframes breath { 0%,100% { transform: scale(.82); } 50% { transform: scale(1); } }
.a-ring { animation-name: ring; animation-timing-function: ease-out; }
@keyframes ring { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.12); opacity: 0; } }
.a-fill { animation-name: fill; transform-origin: 100px 200px; }
@keyframes fill { 0% { transform: translateY(100%); } 70%,100% { transform: translateY(0); } }
.a-shard { animation-name: shard; }
@keyframes shard { 0% { transform: translate(var(--dx), var(--dy)); opacity: 0; } 45%,100% { transform: translate(0,0); opacity: 1; } }
.a-tile { animation-name: tile; transform-box: fill-box; transform-origin: center; }
@keyframes tile { 0% { opacity: 0; transform: scale(.3); } 40%,100% { opacity: 1; transform: scale(1); } }
.a-in { animation-name: inward; animation-timing-function: linear; }
@keyframes inward { 0% { transform: scale(1.15); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(.15); opacity: 0; } }
.a-seg { animation-name: seg; animation-timing-function: steps(1); }
@keyframes seg { 0% { opacity: .15; } 10%,100% { opacity: 1; } }
.a-spin { animation-name: spin; animation-timing-function: linear; animation-duration: 6s; }
.a-spinr { animation-name: spin; animation-timing-function: linear; animation-duration: 6s; animation-direction: reverse; }
.cool .a-spinr { animation-direction: normal; }
@keyframes spin { to { transform: rotate(360deg); } }
.a-stack { animation-name: stack; }
@keyframes stack { 0%,100% { transform: scale(.55); opacity: .35; } 50% { transform: scale(1); opacity: 1; } }

@media (prefers-reduced-motion: reduce) { *, .an { animation: none !important; transition: none !important; } }

function forecast(d) {

  const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n;
  const b = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / xs.reduce((a, x) => a + (x - mx) ** 2, 0); const a = my - b * mx;

}

  $('calnext') && ($('calnext').onclick = () => { if (calMonth < 0) { calMonth++; renderProgress(); } });
  const strip = $('strip');
  if (strip) { strip.scrollLeft = strip.scrollWidth; const tb = $('todaybtn'); strip.addEventListener('scroll', () => { tb.hidden = strip.scrollLeft > strip.scrollWidth - strip.clientWidth - 40; }); tb.onclick = () => strip.scrollTo({ left: strip.scrollWidth, behavior:'smooth' }); }
  renderCharts();
}
function bindDays() {
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { selDay = +b.dataset.day; dayOpen = false; document.querySelectorAll('[data-day]').forEach(x => x.classList.toggle('sel', x === b)); $('daycard').innerHTML = dayCard(); bindDayCard(); });
  bindDayCard();
}
function bindDayCard() { $('daymore') && ($('daymore').onclick = () => { dayOpen = !dayOpen; $('daycard').innerHTML = dayCard(); bindDayCard(); }); }
function dayTile(ago) { const d = dayDate(ago), h = histOn(ago); return `<button class="day ${h?'on':''} ${ago===0?'today':''} ${selDay===ago?'sel':''}" data-day="${ago}"><small>${t('wd')[(d.getDay()+6)%7]}</small><b class="num">${d.getDate()}</b></button>`; }
function dayCard() {
  const ago = selDay ?? (HISTORY.map(h => h.ago).sort((a, b) => a - b)[0] ?? 0); const d = dayDate(ago), h = histOn(ago);
  const ds = d.toLocaleDateString(loc(), { weekday:'long', day:'2-digit', month:'2-digit' });
  if (!h) return `<div class="daycard"><b>${esc(ds)}</b><span class="hint">${t('noWorkout')}</span></div>`;
  const w = wById(h.wid); const nsets = h.ex.reduce((a, e) => a + e.sets.length, 0);
  return `<div class="daycard"><div><div class="eyebrow">${esc(ds)}</div><b style="font-family:var(--display);font-stretch:110%;font-weight:900;font-size:22px;text-transform:uppercase">${esc(w ? w.name : '')}</b></div>
    <div class="daystats num"><span><b>${fmt(sessVol(h)/1000,1)} t</b> ${t('moved')}</span><span><b>${h.dur}</b> min</span><span><b>${nsets}</b> ${t('setsWord')}</span></div>
    <button class="morebtn" id="daymore"><span class="mdec dec">${dayOpen ? '−' : '+'}</span>${dayOpen ? t('hide') : t('details')}</button>
    ${dayOpen ? `<div>${h.ex.map(e => `<div class="detail-ex">${ico(e.k)}<b>${esc(exName(e.k))}</b><span class="num">${e.sets.map((s, j) => `${j+1}: ${esc(wLabel(e.k, s.w))} × ${s.r}`).join(' · ')}</span></div>`).join('')}</div>` : ''}</div>`;
}
function calHTML() {
  const today = dayDate(0); const m = new Date(today.getFullYear(), today.getMonth() + calMonth, 1);
  const first = (m.getDay() + 6) % 7, days = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
  let g = t('wd').map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < first; i++) g += '<button class="out" tabindex="-1"></button>';
  for (let dd = 1; dd <= days; dd++) { const d = new Date(m.getFullYear(), m.getMonth(), dd, 12); const ago = Math.round((today - d) / 864e5); const h = ago >= 0 ? histOn(ago) : null;
    g += ago < 0 ? `<button disabled style="opacity:.3">${dd}</button>` : `<button class="${h?'on':''} ${ago===0?'today':''} ${selDay===ago?'sel':''}" data-day="${ago}">${dd}</button>`; }
  return `<div style="display:flex;flex-direction:column;gap:10px"><div class="row"><button class="iconbtn" id="calprev" aria-label="zurück" style="width:36px;height:36px;font-size:16px">‹</button><b>${m.toLocaleDateString(loc(), { month:'long', year:'numeric' })}</b><button class="iconbtn" id="calnext" aria-label="vor" style="width:36px;height:36px;font-size:16px;${calMonth<0?'':'opacity:.3'}">›</button></div><div class="calgrid">${g}</div></div>`;
}
function pbHTML() {
  return Object.keys(EX).map(k => { const ss = sessionsFor(k).filter(s => s.best > 0); if (!ss.length) return null; const b = ss.reduce((x, y) => y.best > x.best ? y : x); const s = b.sets.reduce((x, y) => e1rm(effW(k, y.w), y.r) > e1rm(effW(k, x.w), x.r) ? y : x); return { k, ago:b.ago, w:s.w, r:s.r, best:b.best }; })
    .filter(Boolean).sort((a, b) => a.ago - b.ago).slice(0, 6).map(p => `<div class="pb"><b>${esc(exName(p.k))}</b><span class="pw num">${esc(wLabel(p.k, p.w))} × ${p.r}</span><small>${dShort(dayDate(p.ago))}</small><small>${t('approx', fmt(Math.round(p.best)))}</small></div>`).join('');
}
function renderCharts() {
  const k = S.chartKey; const ss = sessionsFor(k).slice(0, 12).reverse();
  const wrap = $('charts');
  if (!ss.length) { wrap.innerHTML = `<div class="empty">${t('notTrained')}</div>`; return; }
  if (ss.every(s => s.best <= 0)) { wrap.innerHTML = `<div class="empty">${t('bwEmpty')}</div>`; return; }
  const defs = [
    { id:'str', title:t('chStrength'), info:'info1rm', data:ss.map(s => s.best), fc:true },
    { id:'vol', title:t('chVolume'), info:'infoVol', data:ss.map(s => s.vol) },
    { id:'wgt', title:t('chWeight'), info:'infoWeight', data:ss.map(s => effW(k, s.top.w)) }
  ];
  wrap.innerHTML = defs.map(d => `<div class="chartbox"><div class="charthead"><h2>${d.title}<button class="info" data-info="${d.info}" aria-label="Info">i</button></h2><span class="val num" id="val-${d.id}"></span></div>${info[d.info] ? `<div class="infobox">${t(d.info)}</div>` : ''}<svg class="chart" id="ch-${d.id}" role="img" aria-label="${d.title}"></svg>${d.fc ? `<div class="legend"><span><i></i>${t('trend')}</span><span><i class="dash"></i>${t('forecast')}</span><button class="info" data-info="infoFc" aria-label="Info" style="margin-left:-8px">i</button></div>${info.infoFc ? `<div class="infobox">${t('infoFc')}</div>` : ''}` : ''}</div>`).join('');
  wrap.querySelectorAll('[data-info]').forEach(b => b.onclick = () => { info[b.dataset.info] = !info[b.dataset.info]; renderCharts(); });
  defs.forEach(d => drawChart(d, ss));
}
function drawChart(def, ss) {
  const d = def.data, f = def.fc && d.length >= 4 ? forecast(d) : [], all = d.length + f.length, li = d.length - 1;
  const W0 = 340, H0 = def.fc ? 200 : 150, L = 40, R = 12, Tp = 12, B = 22;
  const vals = d.concat(f.map(p => p.y + p.band), f.map(p => p.y - p.band));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * .15 || 5; lo -= pad; hi += pad;
  const x = i => L + i * (W0 - L - R) / Math.max(1, all - 1), y = v => Tp + (hi - v) * (H0 - Tp - B) / (hi - lo);
  const nice = v => def.id === 'vol' ? (v >= 1000 ? fmt(v/1000, 1) + 't' : fmt(Math.round(v))) : fmt(Math.round(v));
  let s = '';
  [lo + pad, (lo + hi) / 2, hi - pad].forEach(v => s += `<line x1="${L}" x2="${W0-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="var(--muted)">${nice(v)}</text>`);
  if (f.length) {
    s += `<line x1="${x(li)}" x2="${x(li)}" y1="${Tp}" y2="${H0-B}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    const band = [[x(li), y(d[li])]].concat(f.map((p, h) => [x(li+1+h), y(p.y + p.band)])).concat(f.map((p, h) => [x(li+1+h), y(p.y - p.band)]).reverse());
    s += `<polygon points="${band.map(p => p.join(',')).join(' ')}" fill="var(--fg)" opacity=".07"/><polyline points="${x(li)},${y(d[li])} ${f.map((p, h) => `${x(li+1+h)},${y(p.y)}`).join(' ')}" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 5"/>`;
  }
  const pts = d.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  s += `<polygon points="${x(0)},${H0-B} ${pts} ${x(li)},${H0-B}" fill="var(--fg)" opacity=".08"/><polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linejoin="round"/>`;
  const dateAt = i => i <= li ? dShort(dayDate(ss[i].ago)) : dShort(dayDate(ss[li].ago - (i - li) * 7));
  [[0,'start'], [all - 1,'end']].forEach(([i, a]) => s += `<text x="${x(i)}" y="${H0-6}" text-anchor="${a}" font-size="10" font-family="var(--mono)" fill="var(--muted)">${dateAt(i)}</text>`);
  s += `<g class="scrub"></g>`;
  const svg = $('ch-' + def.id); svg.setAttribute('viewBox', `0 0 ${W0} ${H0}`); svg.innerHTML = s;
  const sc = svg.querySelector('.scrub'), val = $('val-' + def.id);
  const unit = v => def.id === 'vol' ? (v >= 1000 ? fmt(v/1000, 2) + ' t' : fmt(Math.round(v)) + ' kg') : fmtW(r05(v)) + ' kg';
  const showAt = (i, scrub) => {
    const isF = i > li, v = isF ? f[i-li-1].y : d[i], X = x(i), Y = y(v);
    const extra = def.id === 'wgt' && !isF ? ` × ${ss[i].top.r}` : '';
    val.textContent = `${unit(v)}${extra} · ${dateAt(i)}${isF ? ' · ' + t('forecastTag') : ''}`;
    sc.innerHTML = (scrub ? `<line x1="${X}" x2="${X}" y1="${Tp}" y2="${H0-B}" stroke="var(--fg)" stroke-dasharray="3 3"/>` : '') + `<circle cx="${X}" cy="${Y}" r="5" fill="${isF ? 'var(--bg)' : 'var(--fg)'}" stroke="var(--fg)" stroke-width="2"/>`;
  };
  const idxAt = e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W0; return Math.max(0, Math.min(all - 1, Math.round((px - L) / ((W0 - L - R) / Math.max(1, all - 1))))); };
  let down = false;
  svg.addEventListener('pointerdown', e => { down = true; svg.setPointerCapture(e.pointerId); showAt(idxAt(e), true); });
  svg.addEventListener('pointermove', e => { if (down || e.pointerType === 'mouse') showAt(idxAt(e), true); });
  const reset = () => { down = false; showAt(li, false); };
  svg.addEventListener('pointerup', reset); svg.addEventListener('pointercancel', reset); svg.addEventListener('pointerleave', reset);
  showAt(li, false);
}

  </div>`;
  $('l-de').onclick = () => setLang('de'); $('l-en').onclick = () => setLang('en');

  $('bwi').onclick = () => { bwInfoOpen = !bwInfoOpen; renderSettings(); };

  $('bwp').onclick = () => { S.bwPoints = !S.bwPoints; renderSettings(); };
  document.querySelectorAll('[data-anim]').forEach(b => b.onclick = () => { S.anim = b.dataset.anim; renderSettings(); if (W && W.mode !== 'review') renderW(); });

function setLang(l) { S.lang = l; document.documentElement.lang = l; greetText = greeting(); document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t)); renderSettings(); if (W) renderW(); }

/* ---------- Keyboard helpers ---------- */
function kbFix() { const vv = window.visualViewport; if (!vv) return; const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', off + 'px'); }
if (window.visualViewport) { visualViewport.addEventListener('resize', kbFix); visualViewport.addEventListener('scroll', kbFix); }
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); } });
const isNumInput = el => el && el.getAttribute && ['decimal','numeric'].includes(el.getAttribute('inputmode'));
document.addEventListener('focusin', e => { if (isNumInput(e.target)) { $('kbdone').textContent = t('done'); $('kbdone').hidden = false; } });
document.addEventListener('focusout', () => setTimeout(() => { if (!isNumInput(document.activeElement)) $('kbdone').hidden = true; }, 50));
$('kbdone').addEventListener('pointerdown', e => { e.preventDefault(); const a = document.activeElement; if (a) a.blur(); $('kbdone').hidden = true; });

document.documentElement.lang = S.lang;

document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
